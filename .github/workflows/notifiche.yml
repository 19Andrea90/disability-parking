name: Notifiche all'admin

# Ogni 15 minuti controlla se sono arrivati suggerimenti, posti segnalati dagli utenti o errori dell'app
# e, se sì, manda un'email riassuntiva. "Run workflow" a mano con prova = si manda un'email di prova.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: Manda comunque un'email di prova (si/no)
        default: 'no'

permissions:
  contents: read

concurrency:
  group: notifiche
  cancel-in-progress: false

jobs:
  notifiche:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Controlla e avvisa
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          NOTIFICHE_A: ${{ secrets.NOTIFICHE_A || 'info.disabilityparking@gmail.com' }}
          NOTIFICHE_DA: ${{ secrets.NOTIFICHE_DA }}
        run: python3 -u tools/notifiche.py ${{ inputs.prova == 'si' && '--prova' || '' }}
