name: Scansione FVG (in parallelo)

# Scansiona i comuni del FVG ancora da fare con la rete neurale, su più macchine insieme.
# Parte dalla fine dell'alfabeto (l'altra scansione parte dall'inizio) e ogni lavoro prende comuni diversi.
# Si avvia a mano da Actions → "Scansione FVG (in parallelo)" → Run workflow. Si può rilanciare quante volte serve:
# i comuni finiti non vengono rifatti e quelli interrotti riprendono dal punto salvato.

on:
  workflow_dispatch:
    inputs:
      lavori:
        description: Quante macchine insieme
        default: '8'
      solo:
        description: Solo questi comuni (nomi separati da virgola; vuoto = tutti quelli da fare)
        default: ''
      minuti:
        description: Dopo quanti minuti non iniziare nuovi comuni
        default: '300'

permissions:
  contents: read

jobs:
  piano:
    runs-on: ubuntu-latest
    outputs:
      parti: ${{ steps.p.outputs.parti }}
    steps:
      - id: p
        run: echo "parti=$(python3 -c "print(list(range(max(1, min(20, int('${{ inputs.lavori }}'))))))")" >> "$GITHUB_OUTPUT"

  scansione:
    needs: piano
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJson(needs.piano.outputs.parti) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requisiti-scansione.txt
      - name: Librerie
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r tools/requisiti-scansione.txt
      - name: Scansione
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DP_CHI: github-${{ github.run_number }}-${{ matrix.parte }}
          PYTHONWARNINGS: ignore
          SOLO: ${{ inputs.solo }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "Manca il segreto SUPABASE_SERVICE_KEY"; exit 1; fi
          export DP_STATE="$RUNNER_TEMP"
          python3 -u tools/scan_fvg.py --auto 85 --scarta 30 --rovescio --primi "" \
            --parte "${{ matrix.parte }}/${{ strategy.job-total }}" --minuti "${{ inputs.minuti }}" --solo "$SOLO"
