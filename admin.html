<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<title>Disability Parking — Admin</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css">
<style>
body{overflow:auto;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar h1{font-size:22px}
.bar .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn{padding:9px 12px;min-height:40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
#amap{height:380px;border-radius:16px;position:relative;inset:auto}
.row-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border-radius:14px;background:var(--panel);margin-bottom:8px;border:1px solid var(--line);cursor:pointer}
.row-item.sel{border-color:var(--giallo);box-shadow:0 0 0 2px var(--giallo)}
.row-item .n{font-weight:650}
.row-item .s{font-size:13px;color:var(--muted)}
.login{max-width:420px;margin:60px auto;background:var(--panel);padding:24px;border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.edit{background:var(--panel);padding:16px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.edit img{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.edit .acts{display:flex;gap:8px;flex-wrap:wrap}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Disability Parking · Admin</h1><span class="sp"></span>
    <a class="btn" href="index.html">← App</a>
    <button class="btn" id="logout" hidden>Esci</button>
  </div>

  <div class="login" id="login">
    <h2>Accesso amministratore</h2>
    <div class="sub">Usa l'email registrata come admin. La prima volta crea la password con "Registrati".</div>
    <input type="email" id="l-email" placeholder="email" autocomplete="username">
    <input type="password" id="l-pass" placeholder="password" autocomplete="current-password">
    <div class="actions"><button class="btn primary wide" id="l-in">Entra</button><button class="btn" id="l-up">Registrati</button></div>
    <div class="sub" id="l-msg"></div>
  </div>

  <div id="panel" hidden>
    <div class="kpi" id="kpi"></div>
    <div class="tabs">
      <button class="btn active" data-f="proposto">Da approvare</button>
      <button class="btn" data-f="verificato">Verificati</button>
      <button class="btn" data-f="ufficiale">Ufficiali</button>
      <button class="btn" data-f="rifiutato">Rifiutati</button>
      <button class="btn" data-f="segnalati">Con "non esiste"</button>
    </div>
    <div class="grid">
      <div>
        <div id="amap"></div>
        <div id="rows" style="margin-top:12px"></div>
      </div>
      <div class="edit" id="edit"><div class="sub">Seleziona uno stallo dalla lista o dalla mappa.</div></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
